name: Ardour 9.8 Windows x64 temporary build

on:
  push:
    branches:
      - ardour-9.8-win64-build

permissions:
  contents: read

concurrency:
  group: ardour-9.8-win64-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    env:
      ARDOUR_VERSION: '9.8'
      ARDOUR_COMMIT: '22ed8656c2533e325322ff11831448e5123e0d4b'
    steps:
      - name: Setup xmake development branch
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a
        with:
          xmake-version: branch@dev

      - name: Build Ardour
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Run([string] $Program, [string[]] $Arguments) {
            Write-Host ('> ' + $Program + ' ' + ($Arguments -join ' '))
            & $Program @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Program failed with exit code $LASTEXITCODE" }
          }
          function Add-ToPath([string] $Folder) {
            if ((Test-Path -LiteralPath $Folder) -and (($env:PATH -split ';') -notcontains $Folder)) {
              $env:PATH = "$Folder;$env:PATH"
            }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe missing' }
          $vs = (& $vswhere -latest -products '*' -version '[18.0,19.0)' -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio 2026 (major 18) not found' }
          $bat = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $vsEnvCmd = Join-Path $env:RUNNER_TEMP 'enter-vs-env.cmd'
          @"
          @echo off
          call "$bat" -arch=amd64 -host_arch=amd64 >nul
          if errorlevel 1 exit /b %errorlevel%
          set
          "@ | Set-Content -LiteralPath $vsEnvCmd -Encoding ascii
          $out = & cmd.exe /d /c $vsEnvCmd
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize VS developer environment' }
          foreach ($line in $out) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          Add-ToPath (Join-Path $vs 'VC\Tools\Llvm\x64\bin')
          Add-ToPath 'C:\Program Files\LLVM\bin'
          foreach ($tool in 'git','python','xmake','xrepo','cl','llvm-nm') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Missing tool: $tool" }
          }

          $root = Join-Path $env:RUNNER_TEMP 'ardour-work'
          $deps = Join-Path $root 'stack'
          $source = Join-Path $root 'ardour-9.8'
          $stage = Join-Path $root 'install-9.8'
          $bundle = Join-Path $root 'ardour-9.8-win64-portable'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $root,$deps,$dist | Out-Null

          $xmakeLua = @'
          set_policy("package.sync_requires_to_deps", true)
          set_policy("package.requires_lock", true)
          add_requireconfs("**", {configs = {shared = true}, system = false, build = true})
          add_requires("libcurl")
          add_requires("boost")
          add_requires("libsndfile")
          add_requires("libarchive")
          add_requires("liblo")
          add_requires("taglib")
          add_requires("vamp-plugin-sdk")
          add_requires("libusb")
          add_requires("rubberband")
          add_requires("jack2")
          add_requires("fftw")
          add_requires("aubio")
          add_requires("libxml2")
          add_requires("cppunit")
          add_requires("libwebsockets")
          add_requires("portaudio", {configs = {asio = true}})
          add_requires("libsamplerate")
          add_requires("lilv")
          add_requires("libjpeg-turbo")
          add_requires("lrdf")
          add_requires("pangomm <2.48.0")
          if is_plat("windows") then
              add_requires("pthreads4w")
          end
          target("collect_deps")
              set_kind("phony")
              after_load(function()
                  import("core.project.config")
                  import("core.cache.localcache")
                  local dest = path.join(os.projectdir(), config.mode() or "release")
                  local subdirs = {"include", "lib"}
                  if is_plat("windows") then table.insert(subdirs, "bin") end
                  local skip = {python = true, cmake = true, ninja = true, meson = true, gperf = true}
                  local function pkgname(installdir)
                      local parts = path.split(installdir)
                      return parts[#parts - 2]
                  end
                  local refs = localcache.cache("references")
                  local pkgs = refs:get("packages") or {}
                  os.mkdir(dest)
                  for _, installdir in ipairs(pkgs) do
                      if not skip[pkgname(installdir)] then
                          for _, sub in ipairs(subdirs) do
                              local src = path.join(installdir, sub)
                              if sub == "lib" then
                                  for _, fp in ipairs(os.files(path.join(src, "**"))) do
                                      local tgt = path.join(dest, sub, path.relative(fp, src))
                                      os.mkdir(path.directory(tgt))
                                      os.cp(fp, tgt)
                                  end
                              elseif os.isdir(src) then
                                  os.cp(src, dest)
                              end
                          end
                      end
                  end
              end)
          '@
          Set-Content -LiteralPath (Join-Path $deps 'xmake.lua') -Value $xmakeLua -Encoding utf8

          Push-Location $deps
          try {
            Run 'xrepo' @('update-repo')
            Run 'xmake' @('f','-c','-m','release','-y')
            Run 'xmake' @('-y')
          } finally { Pop-Location }

          $depBin = Join-Path $deps 'release\bin'
          $depInc = Join-Path $deps 'release\include'
          $depLib = Join-Path $deps 'release\lib'
          $depPc = Join-Path $depLib 'pkgconfig'
          foreach ($dir in $depBin,$depInc,$depLib,$depPc) {
            if (-not (Test-Path -LiteralPath $dir)) { throw "Dependency output missing: $dir" }
          }
          $lock = Join-Path $deps 'xmake-requires.lock'
          if (-not (Test-Path -LiteralPath $lock)) { throw 'xmake-requires.lock was not generated' }

          Run 'git' @('clone','--branch',$env:ARDOUR_VERSION,'--single-branch','https://github.com/Ardour/ardour.git',$source)
          Push-Location $source
          try {
            Run 'git' @('fetch','--tags','--force','origin')
            $tagCommit = (& git rev-parse "refs/tags/$($env:ARDOUR_VERSION)^{commit}").Trim()
            if ($tagCommit -ne $env:ARDOUR_COMMIT) {
              throw "Tag mismatch. Expected $env:ARDOUR_COMMIT, got $tagCommit"
            }
            Run 'git' @('checkout','--detach',$env:ARDOUR_COMMIT)
            Run 'git' @('submodule','update','--init','--recursive')

            Add-ToPath $depBin
            $env:PKG_CONFIG_PATH = $depPc
            $env:PKG_CONFIG_LIBDIR = $depPc
            $includeArg = $depInc
            $pthreadInclude = Join-Path $depInc 'pthread'
            if (Test-Path -LiteralPath $pthreadInclude) { $includeArg = "$depInc,$pthreadInclude" }

            Run 'python' @('waf','configure',"--prefix=$stage",'--configdir=share','--ptformat','--dist-target=msvc','--cxx17','--optimize',"--also-include=$includeArg","--also-libdir=$depLib")
            Run 'python' @('waf','-j','4')
            Run 'python' @('waf','install')
          } finally { Pop-Location }

          $main = @(Get-ChildItem -LiteralPath $stage -Recurse -File -Filter '*.exe' |
            Where-Object { $_.Name -match '^ardour(?:[-_]\d+(?:\.\d+)*)?\.exe$' })
          if ($main.Count -ne 1) { throw "Expected one Ardour executable; found $($main.Count)" }
          $rel = [IO.Path]::GetRelativePath($stage,$main[0].FullName)

          if (Test-Path -LiteralPath $bundle) { Remove-Item -LiteralPath $bundle -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          $appRoot = Join-Path $bundle 'app'
          Copy-Item -LiteralPath $stage -Destination $appRoot -Recurse -Force
          $packagedExe = Join-Path $appRoot $rel

          $runtimeDlls = @(Get-ChildItem -LiteralPath $depBin -File -Filter '*.dll')
          if ($runtimeDlls.Count -eq 0) { throw 'No runtime DLLs collected' }
          $exeDirs = @(Get-ChildItem -LiteralPath $appRoot -Recurse -File -Filter '*.exe' |
            ForEach-Object { $_.Directory.FullName } | Sort-Object -Unique)
          foreach ($dir in $exeDirs) {
            foreach ($dll in $runtimeDlls) {
              Copy-Item -LiteralPath $dll.FullName -Destination $dir -Force
            }
          }
          Copy-Item -LiteralPath (Join-Path $source 'COPYING') -Destination (Join-Path $bundle 'COPYING') -Force
          Copy-Item -LiteralPath $lock -Destination (Join-Path $bundle 'xmake-requires.lock') -Force

          function Get-PeMachine([string] $Path) {
            $stream = [IO.File]::OpenRead($Path)
            $reader = [IO.BinaryReader]::new($stream)
            try {
              if ($stream.Length -lt 64) { return $null }
              if ($reader.ReadUInt16() -ne 0x5A4D) { return $null }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              if ($peOffset -le 0 -or $peOffset -ge ($stream.Length - 6)) { return $null }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { return $null }
              return $reader.ReadUInt16()
            } finally { $reader.Dispose(); $stream.Dispose() }
          }
          $bad = @()
          Get-ChildItem -LiteralPath $bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe','.dll' } |
            ForEach-Object {
              $m = Get-PeMachine $_.FullName
              if ($null -eq $m -or $m -ne 0x8664) { $bad += "$($_.FullName) machine=$m" }
            }
          if ($bad.Count -gt 0) { throw "Invalid/non-AMD64 PE files:`n$($bad -join "`n")" }

          $oldPath = $env:PATH
          try {
            $env:PATH = (($oldPath -split ';' | Where-Object {
              $_ -and ($_ -notmatch '(?i)ardour-work|\\stack\\release\\bin')
            }) -join ';')
            $versionOutput = & $packagedExe --version 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "Ardour --version failed: $versionOutput" }
            if ($versionOutput -notmatch [regex]::Escape($env:ARDOUR_VERSION)) {
              throw "Wrong version output: $versionOutput"
            }
            Write-Host "RUNTIME-SMOKE-OK: $($versionOutput.Trim())"
          } finally { $env:PATH = $oldPath }

          $buildInfo = @"
          Ardour $env:ARDOUR_VERSION Windows x64 self-build
          Commit: $env:ARDOUR_COMMIT
          Visual Studio: $vs
          Xmake: $((& xmake --version 2>&1 | Out-String).Trim())
          Built UTC: $([DateTime]::UtcNow.ToString('o'))
          Runtime smoke: ardour.exe --version passed with build-tree dependency paths removed.
          This is an unofficial self-built package, not an official ardour.org binary.
          "@
          Set-Content -LiteralPath (Join-Path $bundle 'BUILD-INFO.txt') -Value $buildInfo -Encoding utf8

          $zip = Join-Path $dist 'ardour-9.8-win64-portable-22ed8656c253.zip'
          Compress-Archive -LiteralPath $bundle -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256" -Value "$hash  $(Split-Path $zip -Leaf)" -Encoding ascii
          Copy-Item -LiteralPath $lock -Destination (Join-Path $dist 'xmake-requires.lock') -Force
          Write-Host "SUCCESS: $zip"
          Write-Host "SHA256: $hash"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ardour-9.8-build-diagnostics
          path: |
            ${{ runner.temp }}/ardour-work/ardour-9.8/config.log
            ${{ runner.temp }}/ardour-work/ardour-9.8/build/config.log
            ${{ runner.temp }}/ardour-work/stack/xmake-requires.lock
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload verified portable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ardour-9.8-win64-portable
          path: |
            dist/ardour-9.8-win64-portable-22ed8656c253.zip
            dist/ardour-9.8-win64-portable-22ed8656c253.zip.sha256
            dist/xmake-requires.lock
          if-no-files-found: error
          retention-days: 30
